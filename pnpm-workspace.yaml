# 依赖构建脚本开关
#
# pnpm 10+ 默认不执行依赖的 postinstall，要求在这里逐个表态（值必须是布尔；
# 写字符串会被当成「未放行」，pnpm install 以 ERR_PNPM_IGNORED_BUILDS 退出，
# 而且它会连 legacy 的 onlyBuiltDependencies 一起无视——所以这里只用 allowBuilds）。
#
# 放行 bufferutil / utf-8-validate：它们的 postinstall 只是从包内已发布的
# prebuilds 里挑一个二进制，离线可跑，能让 ws 走原生加速。
# 其余显式关闭：
#   - esbuild：平台二进制来自可选依赖 @esbuild/<platform>，不需要 postinstall
#   - node-datachannel / utp-native：Windows 上会去下载或本地编译，容易失败；
#     本项目只在浏览器里用 WebRTC，Node 侧不需要
#   - ip-set：纯 JS，没有实际构建产物需求
#   - ffmpeg-static：页面转码用的是 CDN 上的 @ffmpeg/core，不依赖它
allowBuilds:
  bufferutil: true
  utf-8-validate: true
  esbuild: false
  node-datachannel: false
  utp-native: false
  ip-set: false
  ffmpeg-static: false

overrides:
  uint8-util: <2.3.0

patchedDependencies:
  fsa-chunk-store@1.3.0: patches/fsa-chunk-store@1.3.0.patch
