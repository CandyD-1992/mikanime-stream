services:
  mikanime-stream:
    build: .
    image: mikanime-stream:latest
    container_name: mikanime-stream
    ports:
      - "12348:3000"
    restart: unless-stopped
    # NAS 容器经常解析不了外网域名（报 getaddrinfo EAI_AGAIN），
    # 这里改用公共 DNS；如果你所在网络屏蔽公共 DNS，删掉这段即可。
    dns:
      - 223.5.5.5
      - 119.29.29.29
      - 114.114.114.114
    # 可选环境变量（也可在页面“设置”里填写，页面优先级更高）：
    # TMDB_API_KEY 建议放在同目录 .env 里，不会进代码仓库；
    # 不填 Key 时，若 TMDB_API_BASE 是免 Key 的公共镜像也可以直接用。
    # TMDB_API_BASE 若为代理模板请用 {url} 占位，如 https://corsproxy.io/?url={url}
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - TMDB_API_BASE=${TMDB_API_BASE:-}
      - TMDB_API_FALLBACKS=${TMDB_API_FALLBACKS:-}
      - MIKAN_BASE=${MIKAN_BASE:-}
